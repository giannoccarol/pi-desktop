name: Auto Versioning

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione manuale 0.x.y (es. 0.5.1, 0.100.100) - lascia vuoto per auto da commit"
        required: false
        type: string
  push:
    branches:
      - main
    paths-ignore:
      - "CHANGELOG.md"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: versioning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Determine and publish version
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Manual version (0.x.y)
        if: inputs.version != ''
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$MANUAL_VERSION" =~ ^0\.([0-9]{1,3})\.([0-9]{1,3})$ ]]; then
            echo "Versione manuale deve essere 0.x.y con x,y <=100 (es. 0.5.0, 0.100.100)" >&2
            exit 1
          fi
          minor="$(echo "$MANUAL_VERSION" | cut -d. -f2)"
          patch="$(echo "$MANUAL_VERSION" | cut -d. -f3)"
          if [ "$minor" -gt 100 ] || [ "$patch" -gt 100 ]; then
            echo "Minor/patch devono essere <=100 per 0.x" >&2
            exit 1
          fi
          node scripts/build/set-version.js "$MANUAL_VERSION"
          git push origin main --follow-tags
          echo "Manual release $MANUAL_VERSION pushato"
          exit 0

      - name: Run semantic-release
        if: inputs.version == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: Lorenzo Giannoccaro
          GIT_AUTHOR_EMAIL: lorenzo.giannoccaro998@gmail.com
          GIT_COMMITTER_NAME: Lorenzo Giannoccaro
          GIT_COMMITTER_EMAIL: lorenzo.giannoccaro998@gmail.com
        run: npx semantic-release

      - name: Dispatch atomic native release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          release_commit="$(git rev-parse origin/main)"
          if [[ "$release_commit" == "$GITHUB_SHA" ]]; then
            echo "No release commit was created."
            exit 0
          fi
          tag="$(git tag --points-at "$release_commit" --list 'v*.*.*' --sort=-version:refname | head -n 1)"
          if [[ -z "$tag" ]]; then
            echo "The release commit has no semantic version tag." >&2
            exit 1
          fi
          gh workflow run release.yml --ref "$tag"
