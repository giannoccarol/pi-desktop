name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux quality, Electron and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Prepare build assets
        run: node scripts/prepare-build-assets.js
      - name: Verify Linux package
        run: npx electron-builder --linux --dir --publish never

  windows:
    name: Windows tests, Electron and package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Prepare build assets
        run: node scripts/prepare-build-assets.js
      - name: Verify unsigned Windows package
        run: npx electron-builder --win --dir --publish never

  macos:
    name: macOS scheduled and release verification
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Prepare build assets
        run: node scripts/prepare-build-assets.js
      - name: Verify macOS package
        run: npx electron-builder --mac --dir --publish never
